name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        # main.py is a notebook-style script (uses IPython %magic commands,
        # e.g. %load_ext autoreload) and isn't valid standalone Python, so
        # it's excluded here.
        run: python -m py_compile extract_data.py trading_env.py train_and_evaluate.py SaveOnBestTrainingRewardCallback.py evaluate_policy.py
